id: org.codify.Codify
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: codify

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: codify
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/codify /app/bin/codify
      - install -Dm644 packaging/linux/codify.desktop /app/share/applications/org.codify.Codify.desktop
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/512x512/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/256x256/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/128x128/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/64x64/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/48x48/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/32x32/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/24x24/apps/org.codify.Codify.png
      - install -Dm644 packaging/icons/source.png /app/share/icons/hicolor/16x16/apps/org.codify.Codify.png
      - install -Dm644 LICENSE /app/share/licenses/codify/LICENSE
      - install -Dm644 README.md /app/share/doc/codify/README.md
    build-options:
      build-args:
        - --share=network
      env:
        - RUSTFLAGS=--remap-path-prefix=/app=/usr
        - CARGO_HOME=/run/build/codify/cargo
        - PATH=/usr/lib/sdk/rust-stable/bin:/app/bin:/usr/bin
    sources:
      - type: dir
        path: ../..