[package]
name = "codify"
version = "0.1.1"
edition = "2024"
description = "Codify — a fast, minimal IDE built with GPUI (Zed's engine)"
authors = ["lordpipon"]
license = "MIT"
repository = "https://github.com/lordpipon/codify"
readme = "README.md"
keywords = ["ide", "editor", "gpui", "terminal"]
categories = ["development-tools"]

[dependencies]
gpui = "0.2.2"
portable-pty = "0.9"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.generate-rpm]
name = "codify"
summary = "A fast, minimal IDE built with GPUI"
license = "MIT"
url = "https://github.com/lordpipon/codify"
assets = [
  { source = "target/release/codify", dest = "/usr/bin/codify", mode = "755" },
  { source = "packaging/linux/codify.desktop", dest = "/usr/share/applications/org.codify.Codify.desktop", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/codify/LICENSE", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/codify/README.md", mode = "644" },
]
