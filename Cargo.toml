[package]
name = "codify"
version = "0.1.0"
edition = "2024"
description = "Codify — a fast, minimal IDE built with GPUI (Zed's engine)"
authors = ["lordpipon"]
license = "MIT"
repository = "https://github.com/lordpipon/codify"
readme = "README.md"
keywords = ["ide", "editor", "gpui", "terminal"]
categories = ["development-tools"]

[dependencies]
gpui = "0.2.2"
portable-pty = "0.9"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1